<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0b1a3d">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desafio Matemático</title>
<style>
  :root {
    --night: #07152f;
    --card: rgba(5, 14, 39, 0.88);
    --sky: #9bcaff;
    --moon: #ffd95b;
    --text: #f7f8ff;
    --text-soft: #c3d7f5;
    --bad: #c8402f;
    --blue: #4e83c5;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    position: relative;
    isolation: isolate;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 67% 37%, rgba(255, 218, 91, .95) 0 3%, rgba(255, 203, 75, .52) 7%, transparent 20%),
      conic-gradient(from 215deg at 67% 39%, transparent 0 9%, rgba(105, 165, 226, .34) 12%, transparent 18%, rgba(46, 99, 169, .48) 25%, transparent 33%, rgba(127, 184, 238, .32) 42%, transparent 50%, rgba(43, 91, 157, .5) 62%, transparent 70%),
      radial-gradient(ellipse at 50% 45%, #285a98 0%, #173d72 37%, #0a214b 72%, #050e25 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -25%;
    z-index: -1;
    pointer-events: none;
    opacity: .62;
    background: repeating-radial-gradient(ellipse at 66% 38%, transparent 0 42px, rgba(169, 211, 255, .22) 47px 52px, transparent 58px 82px);
    transform: rotate(-17deg);
  }
  body::after {
    content: "✦     ★       ·          ✧       ★     ·       ✦       ★       ·       ✧";
    position: fixed;
    inset: 5% 2% auto;
    z-index: -1;
    color: #ffdf68;
    font-size: clamp(20px, 4vw, 42px);
    letter-spacing: clamp(8px, 3vw, 36px);
    line-height: 2.8;
    text-shadow: 0 0 18px rgba(255, 218, 91, .8);
    pointer-events: none;
    opacity: .9;
  }
  .cat-art {
    position: fixed;
    z-index: -1;
    width: min(46vw, 510px);
    min-width: 260px;
    left: -5%;
    bottom: -17%;
    opacity: .84;
    filter: drop-shadow(0 8px 28px rgba(0, 0, 0, .55));
    pointer-events: none;
  }
  main {
    width: 100%;
    position: relative;
    z-index: 1;
    max-width: 620px;
    background: var(--card);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 220, 105, .9);
    border-radius: 26px;
    box-shadow: 0 0 0 7px rgba(246, 201, 69, 0.12), 0 22px 70px rgba(0, 0, 0, 0.58), inset 0 0 36px rgba(95, 147, 216, .1);
    padding: clamp(20px, 4vw, 34px);
  }
  .brand-mark {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    color: var(--moon);
    font-size: 1.35rem;
    text-shadow: 0 0 18px rgba(255, 217, 91, .55);
  }
  .brand-mark span { font-size: 1.7rem; }
  h1 {
    margin: 0 0 8px;
    text-align: center;
    color: var(--moon);
    font-size: clamp(1.65rem, 5vw, 2.25rem);
    letter-spacing: .02em;
    text-shadow: 0 2px 18px rgba(255, 213, 90, .22);
  }
  .subtitle {
    margin: 0 0 22px;
    text-align: center;
    color: var(--text-soft);
    font-size: 0.95rem;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 0.95rem;
    color: var(--text-soft);
  }
  .top b { color: var(--moon); font-size: 1.15rem; }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; }
  select {
    font: inherit;
    color: var(--text);
    background: var(--night);
    border: 1px solid rgba(155, 202, 255, .8);
    border-radius: 10px;
    padding: 4px 8px;
  }
  .prompt {
    min-height: 2.6em;
    margin: 0;
    text-align: center;
    font-size: 1.05rem;
    color: var(--text-soft);
  }
  .prompt sup, .equation sup, .options sup { font-size: 0.6em; line-height: 0; }
  .equation {
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
    margin: 8px 0 28px;
    letter-spacing: 0.02em;
    line-height: 1.5;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
  }
  .equation.big { font-size: clamp(2.6rem, 12vw, 4.4rem); white-space: nowrap; line-height: 1.2; }
  .equation.poly { font-size: clamp(1.5rem, 6vw, 2.3rem); }
  .equation span {
    background: radial-gradient(ellipse at center, rgba(246, 201, 69, 0.28), rgba(246, 201, 69, 0) 72%);
    border-bottom: 2px solid var(--moon);
    padding: 0 8px;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .options button {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text);
    background: linear-gradient(145deg, rgba(40, 78, 133, .92), rgba(14, 34, 78, .96));
    border: 1px solid rgba(155, 202, 255, .78);
    border-radius: 15px;
    padding: 18px 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 7px 18px rgba(0,0,0,.2);
    cursor: pointer;
    transition: transform 0.08s, background 0.15s, color 0.15s;
  }
  .options.poly button { font-size: clamp(1.05rem, 4.2vw, 1.35rem); }
  .options button:hover:not(:disabled) { background: linear-gradient(145deg, #ffe78c, var(--moon)); color: var(--night); border-color: #fff1b7; transform: translateY(-2px); box-shadow: 0 0 22px rgba(255, 217, 91, .3); }
  .options button:focus-visible { outline: 3px solid var(--moon); outline-offset: 3px; }
  .options button.correct { background: var(--moon); color: var(--night); border-color: #fff; box-shadow: 0 0 22px rgba(246, 201, 69, 0.8); }
  .options button.wrong { background: var(--bad); color: #fff; border-color: #ff9a88; animation: shake 0.3s; }
  .options button:disabled { cursor: default; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .msg {
    min-height: 1.6em;
    margin: 18px 0 0;
    text-align: center;
    color: var(--text-soft);
  }
  @media (max-width: 560px) {
    body { padding: 14px 10px; }
    main { border-radius: 20px; }
    .top { align-items: flex-start; }
    .filters { width: 100%; justify-content: space-between; }
    .filters label { display: grid; gap: 5px; flex: 1; }
    .options { gap: 9px; }
    .options button { padding: 16px 5px; font-size: 1.3rem; }
    .cat-art { width: 75vw; left: -22%; bottom: -5%; opacity: .38; }
  }
  @media (prefers-reduced-motion: reduce) {
    .options button, .options button.wrong { transition: none; animation: none; }
  }
</style>
</head>
<body>
<svg class="cat-art" viewBox="0 0 520 650" aria-hidden="true">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263653"/><stop offset=".48" stop-color="#080f22"/><stop offset="1" stop-color="#030817"/></linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bd8290"/><stop offset="1" stop-color="#39263d"/></linearGradient>
  </defs>
  <path d="M90 650 Q45 520 112 410 Q75 340 60 210 L165 275 Q235 230 322 270 L420 190 Q430 310 390 390 Q475 475 465 650Z" fill="url(#fur)" stroke="#6d8db7" stroke-width="5"/>
  <path d="M88 300 Q45 185 62 90 L190 205 Q255 170 330 205 L445 105 Q455 220 397 315 Q350 395 245 397 Q130 390 88 300Z" fill="url(#fur)" stroke="#718daf" stroke-width="5"/>
  <path d="M82 122 L160 213 L110 196Z M365 210 L430 135 L399 230Z" fill="url(#ear)"/>
  <path d="M145 270 Q190 230 242 272 Q210 325 158 300Z" fill="#f4d36b"/>
  <path d="M280 270 Q335 230 374 267 Q350 318 298 302Z" fill="#f4d36b"/>
  <ellipse cx="199" cy="282" rx="12" ry="29" fill="#11182a"/><ellipse cx="329" cy="281" rx="12" ry="29" fill="#11182a"/>
  <path d="M238 330 Q260 316 278 331 Q260 350 238 330Z" fill="#d88e9b"/>
  <path d="M260 347 Q238 370 212 355 M260 347 Q282 370 307 355" fill="none" stroke="#8b9ab4" stroke-width="4" stroke-linecap="round"/>
  <path d="M125 345 L20 330 M130 370 L18 382 M390 345 L500 325 M388 370 L500 390" stroke="#a9c7e9" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M145 430 Q255 480 370 425" fill="none" stroke="#35547d" stroke-width="7" opacity=".8"/>
  <path d="M175 495 Q260 540 345 495" fill="none" stroke="#263e63" stroke-width="6"/>
</svg>
<main>
  <div class="brand-mark"><span>✦</span> ✧ <span>★</span> ✧ <span>✦</span></div>
  <h1>Desafio Matemático</h1>
  <p class="subtitle">Sob um céu estrelado, desafie sua mente: escolha a resposta correta.</p>
  <div class="top">
    <div>Acertos: <b id="score">0</b> &nbsp; Sequência: <b id="streak">0</b></div>
    <div class="filters">
      <label>Conteúdo
        <select id="topic">
          <option value="arith" selected>Contas</option>
          <option value="mix">Misto</option>
          <option value="poly">Polinômios</option>
        </select>
      </label>
      <label>Nível
        <select id="level">
          <option value="1">Fácil</option>
          <option value="2" selected>Médio</option>
          <option value="3">Difícil</option>
        </select>
      </label>
    </div>
  </div>

  <p class="prompt" id="prompt"></p>
  <div class="equation big" id="equation" aria-live="polite"></div>

  <div class="options" id="options"></div>

  <p class="msg" id="msg">Escolha a resposta certa.</p>
</main>

<script>
  const promptEl = document.getElementById('prompt');
  const equationEl = document.getElementById('equation');
  const optionsEl = document.getElementById('options');
  const msgEl = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const levelEl = document.getElementById('level');
  const topicEl = document.getElementById('topic');

  let score = 0;
  let streak = 0;
  let locked = false;

  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = arr => arr[rand(0, arr.length - 1)];
  const shuffle = arr => arr.sort(() => Math.random() - 0.5);
  const nonZero = max => { let n = 0; while (n === 0) n = rand(-max, max); return n; };

  // ---------- Polinômios: vetor de coeficientes [c0, c1, c2, ...] ----------
  const trim = c => { c = c.slice(); while (c.length > 1 && c[c.length - 1] === 0) c.pop(); return c; };
  const add = (a, b) => trim(Array.from({ length: Math.max(a.length, b.length) }, (_, i) => (a[i] || 0) + (b[i] || 0)));
  const sub = (a, b) => add(a, b.map(v => -v));
  const mul = (a, b) => {
    const r = Array(a.length + b.length - 1).fill(0);
    a.forEach((x, i) => b.forEach((y, j) => (r[i + j] += x * y)));
    return trim(r);
  };
  const evalP = (c, x) => c.reduce((s, k, d) => s + k * Math.pow(x, d), 0);

  function fmtPoly(c) {
    c = trim(c);
    let s = '';
    for (let d = c.length - 1; d >= 0; d--) {
      const k = c[d];
      if (!k) continue;
      const abs = Math.abs(k);
      let term;
      if (d === 0) term = `${abs}`;
      else term = (abs === 1 ? '' : abs) + 'x' + (d > 1 ? `<sup>${d}</sup>` : '');
      if (!s) s = (k < 0 ? '−' : '') + term;
      else s += (k < 0 ? ' − ' : ' + ') + term;
    }
    return s || '0';
  }
  const par = c => `(${fmtPoly(c)})`;
  const fmtNum = n => (n < 0 ? '−' + Math.abs(n) : '' + n);
  const fmtArg = n => (n < 0 ? `(−${Math.abs(n)})` : `${n}`);

  // ---------- Opções ----------
  function numOptions(answer, allowNeg) {
    const set = new Set([answer]);
    const spread = Math.max(5, Math.round(Math.abs(answer) * 0.25));
    let tries = 0;
    while (set.size < 4 && tries < 300) {
      tries++;
      const w = answer + rand(-spread, spread);
      if (allowNeg || w >= 0) set.add(w);
    }
    let n = 1;
    while (set.size < 4) set.add(answer + n++);
    return shuffle([...set].map(v => ({ html: fmtNum(v), correct: v === answer })));
  }

  function polyOptions(answer) {
    answer = trim(answer);
    const map = new Map();
    map.set(fmtPoly(answer), { html: fmtPoly(answer), correct: true });
    let tries = 0;
    while (map.size < 4 && tries < 400) {
      tries++;
      const c = answer.slice();
      const i = rand(0, c.length - 1);
      if (Math.random() < 0.35 && c[i] !== 0) c[i] = -c[i];
      else c[i] += rand(1, 3) * (Math.random() < 0.5 ? 1 : -1);
      const t = trim(c);
      if (t.length !== answer.length) continue;
      const key = fmtPoly(t);
      if (!map.has(key)) map.set(key, { html: key, correct: false });
    }
    return shuffle([...map.values()]);
  }

  // ---------- Contas ----------
  function arithQuestion(level) {
    const max = { 1: 12, 2: 50, 3: 99 }[level];
    const ops = level === 1 ? ['+', '−'] : ['+', '−', '×', '÷'];
    const op = pick(ops);
    let a, b, answer;
    if (op === '+') { a = rand(1, max); b = rand(1, max); answer = a + b; }
    else if (op === '−') { a = rand(1, max); b = rand(1, a); answer = a - b; }
    else if (op === '×') { const m = level === 2 ? 10 : 15; a = rand(2, m); b = rand(2, m); answer = a * b; }
    else { const m = level === 2 ? 10 : 15; b = rand(2, m); answer = rand(2, m); a = b * answer; }
    return {
      kind: 'big',
      prompt: 'Resolva a conta:',
      expr: `<span>${a} ${op} ${b}</span> = ?`,
      options: numOptions(answer, false)
    };
  }

  // ---------- Polinômios (ensino médio) ----------
  const randPoly = (deg, max) => {
    const c = [];
    for (let i = 0; i <= deg; i++) c.push(i === deg ? nonZero(max) : rand(-max, max));
    return c;
  };

  const polyGenerators = {
    // Nível 1
    grau() {
      const deg = rand(2, 5);
      const p = randPoly(deg, 5);
      return {
        prompt: 'Qual é o grau do polinômio?',
        expr: `<span>P(x) = ${fmtPoly(p)}</span>`,
        options: numOptions(deg, false).map(o => ({ ...o }))
      };
    },
    valor1() {
      const p = [nonZero(6), nonZero(4)];
      const x = rand(-3, 5);
      return {
        prompt: `Dado P(x) = ${fmtPoly(p)}, calcule:`,
        expr: `<span>P(${fmtNum(x)})</span> = ?`,
        options: numOptions(evalP(p, x), true)
      };
    },
    soma1() {
      const a = [nonZero(6), nonZero(4)];
      const b = [nonZero(6), nonZero(4)];
      const plus = Math.random() < 0.5;
      return {
        prompt: plus ? 'Some os polinômios:' : 'Subtraia os polinômios:',
        expr: `<span>${par(a)} ${plus ? '+' : '−'} ${par(b)}</span>`,
        options: polyOptions(plus ? add(a, b) : sub(a, b))
      };
    },
    // Nível 2
    valor2() {
      const p = randPoly(2, 4);
      const x = rand(-3, 4);
      return {
        prompt: `Dado P(x) = ${fmtPoly(p)}, calcule:`,
        expr: `<span>P(${fmtNum(x)})</span> = ?`,
        options: numOptions(evalP(p, x), true)
      };
    },
    soma2() {
      const a = randPoly(2, 6);
      const b = randPoly(2, 6);
      const plus = Math.random() < 0.5;
      const ans = plus ? add(a, b) : sub(a, b);
      if (ans.length < 2) return polyGenerators.soma2();
      return {
        prompt: plus ? 'Some os polinômios:' : 'Subtraia os polinômios:',
        expr: `<span>${par(a)} ${plus ? '+' : '−'} ${par(b)}</span>`,
        options: polyOptions(ans)
      };
    },
    monomio() {
      const m = [0, nonZero(4)];
      const b = [nonZero(6), nonZero(4)];
      return {
        prompt: 'Multiplique:',
        expr: `<span>${fmtPoly(m)} · ${par(b)}</span>`,
        options: polyOptions(mul(m, b))
      };
    },
    raiz() {
      let r1 = nonZero(5), r2 = nonZero(5);
      while (r2 === r1) r2 = nonZero(5);
      const p = mul([-r1, 1], [-r2, 1]);
      const root = pick([r1, r2]);
      const set = new Set([root]);
      let tries = 0;
      while (set.size < 4 && tries < 300) {
        tries++;
        const w = rand(-9, 9);
        if (w !== r1 && w !== r2) set.add(w);
      }
      return {
        prompt: 'Qual é uma raiz do polinômio?',
        expr: `<span>${fmtPoly(p)} = 0</span>`,
        options: shuffle([...set].map(v => ({ html: fmtNum(v), correct: v === root })))
      };
    },
    // Nível 3
    binomios() {
      const a = [nonZero(6), rand(1, 3)];
      const b = [nonZero(6), rand(1, 3)];
      return {
        prompt: 'Multiplique os binômios:',
        expr: `<span>${par(a)} · ${par(b)}</span>`,
        options: polyOptions(mul(a, b))
      };
    },
    notavel() {
      const a = [nonZero(7), 1];
      return {
        prompt: 'Desenvolva o produto notável:',
        expr: `<span>${par(a)}<sup>2</sup></span>`,
        options: polyOptions(mul(a, a))
      };
    },
    valor3() {
      const p = randPoly(3, 4);
      const x = rand(-2, 3);
      return {
        prompt: `Dado P(x) = ${fmtPoly(p)}, calcule:`,
        expr: `<span>P(${fmtNum(x)})</span> = ?`,
        options: numOptions(evalP(p, x), true)
      };
    },
    resto() {
      const p = randPoly(3, 4);
      const a = nonZero(3);
      const divisor = a > 0 ? `x − ${a}` : `x + ${Math.abs(a)}`;
      return {
        prompt: 'Teorema do resto: qual é o resto da divisão de P(x) por ' + divisor + '?',
        expr: `<span>P(x) = ${fmtPoly(p)}</span>`,
        options: numOptions(evalP(p, a), true)
      };
    }
  };

  const polyByLevel = {
    1: ['grau', 'valor1', 'soma1'],
    2: ['valor2', 'soma2', 'monomio', 'raiz'],
    3: ['binomios', 'notavel', 'valor3', 'resto']
  };

  function polyQuestion(level) {
    const q = polyGenerators[pick(polyByLevel[level])]();
    q.kind = 'poly';
    return q;
  }

  function makeQuestion() {
    const level = levelEl.value;
    const topic = topicEl.value;
    const usePoly = topic === 'poly' || (topic === 'mix' && Math.random() < 0.5);
    return usePoly ? polyQuestion(level) : arithQuestion(level);
  }

  // ---------- Interface ----------
  function nextQuestion() {
    locked = false;
    const q = makeQuestion();
    promptEl.innerHTML = q.prompt;
    equationEl.className = 'equation ' + q.kind;
    equationEl.innerHTML = q.expr;
    optionsEl.className = 'options ' + q.kind;
    optionsEl.innerHTML = '';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.innerHTML = opt.html;
      btn.dataset.correct = opt.correct ? '1' : '0';
      btn.addEventListener('click', () => choose(btn));
      optionsEl.appendChild(btn);
    });
    msgEl.textContent = 'Escolha a resposta certa.';
  }

  function choose(btn) {
    if (locked) return;

    if (btn.dataset.correct === '1') {
      locked = true;
      btn.classList.add('correct');
      score++;
      streak++;
      scoreEl.textContent = score;
      streakEl.textContent = streak;
      msgEl.textContent = 'Muito bem! Próxima questão...';
      [...optionsEl.children].forEach(b => (b.disabled = true));
      setTimeout(nextQuestion, 700);
    } else {
      btn.classList.add('wrong');
      btn.disabled = true;
      streak = 0;
      streakEl.textContent = streak;
      msgEl.textContent = 'Errou. Tente outra opção.';
    }
  }

  levelEl.addEventListener('change', nextQuestion);
  topicEl.addEventListener('change', nextQuestion);
  nextQuestion();
</script>
</body>
</html>
